<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <title>墨页 · Markdown 阅读与编辑</title>
  <script>
    (() => {
      const root = document.documentElement;
      let theme = '';
      try { theme = localStorage.getItem('moye-theme') || ''; } catch { /* Storage may be unavailable. */ }
      root.dataset.theme = theme || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
      if (['md','src'].some(key => new URLSearchParams(location.search).has(key) || new URLSearchParams(location.hash.slice(1)).has(key))) root.classList.add('reader');
    })();
  </script>
  <link rel="stylesheet" href="vendor/katex.min.css">
  <link rel="stylesheet" href="md-renderer.css">
  <link rel="stylesheet" href="styles.css">
  <style id="codeTheme">
    .hljs{color:#242124;background:transparent}
    .hljs-comment,.hljs-quote{color:#777;font-style:italic}
    .hljs-keyword,.hljs-selector-tag,.hljs-tag,.hljs-doctag{color:#7c0a21}
    .hljs-string,.hljs-regexp,.hljs-addition,.hljs-template-tag{color:#476341}
    .hljs-number,.hljs-literal,.hljs-symbol,.hljs-bullet{color:#85501f}
    .hljs-title,.hljs-section,.hljs-selector-class,.hljs-selector-id{color:#68477c}
    .hljs-built_in,.hljs-type,.hljs-attr,.hljs-attribute,.hljs-variable,.hljs-name{color:#31596c}
    .hljs-meta,.hljs-deletion{color:#9a3049}
    .hljs-emphasis{font-style:italic}.hljs-strong{font-weight:bold}
    .hljs-link{text-decoration:underline}
    [data-theme=dark] .hljs{color:#e8e0dd}
    [data-theme=dark] .hljs-comment,[data-theme=dark] .hljs-quote{color:#9f9597}
    [data-theme=dark] .hljs-keyword,[data-theme=dark] .hljs-selector-tag,[data-theme=dark] .hljs-tag,[data-theme=dark] .hljs-doctag{color:#f0a6b5}
    [data-theme=dark] .hljs-string,[data-theme=dark] .hljs-regexp,[data-theme=dark] .hljs-addition,[data-theme=dark] .hljs-template-tag{color:#a9c99f}
    [data-theme=dark] .hljs-number,[data-theme=dark] .hljs-literal,[data-theme=dark] .hljs-symbol,[data-theme=dark] .hljs-bullet{color:#d7b27f}
    [data-theme=dark] .hljs-title,[data-theme=dark] .hljs-section,[data-theme=dark] .hljs-selector-class,[data-theme=dark] .hljs-selector-id{color:#cdb1dc}
    [data-theme=dark] .hljs-built_in,[data-theme=dark] .hljs-type,[data-theme=dark] .hljs-attr,[data-theme=dark] .hljs-attribute,[data-theme=dark] .hljs-variable,[data-theme=dark] .hljs-name{color:#9fc6d7}
    [data-theme=dark] .hljs-meta,[data-theme=dark] .hljs-deletion{color:#e68ea3}
    @media print{[data-theme=dark] .hljs,[data-theme=dark] .hljs *{color:#242124!important}}
  </style>
  <script defer src="vendor/marked.umd.js"></script>
  <script defer src="vendor/purify.min.js"></script>
  <script defer src="vendor/highlight.min.js"></script>
  <script defer src="vendor/katex.min.js"></script>
  <script defer src="md-renderer.js"></script>
  <script defer src="app.js"></script>
</head>
<body>
  <svg style="display:none" aria-hidden="true"><defs><filter id="az-glass" x="0%" y="0%" width="100%" height="100%"><feTurbulence type="fractalNoise" baseFrequency="0.008 0.008" numOctaves="2" seed="114514" result="noise"/><feGaussianBlur in="noise" stdDeviation="2" result="blurred"/><feDisplacementMap in="SourceGraphic" in2="blurred" scale="20" xChannelSelector="R" yChannelSelector="G"/></filter></defs></svg>
  <div class="workspace" id="workspace" data-mode="edit">
    <header class="toolbar">
      <div class="brand"><h1>墨页</h1><span>Markdown / 阅读与编辑</span></div>
      <nav class="mode-switch" aria-label="显示模式">
        <button id="editMode" type="button" aria-pressed="true">编辑模式</button>
        <button id="viewMode" type="button" aria-pressed="false">查看模式</button>
      </nav>
      <div class="actions"><button id="openFile">打开文件</button><button id="example">示例</button><button id="clear">清空</button><button id="copyHtml">复制 HTML</button><button id="share">复制阅读链接</button><button id="themeToggle" type="button" aria-pressed="false">深色</button></div>
      <form id="sourceForm"><label for="source">文件地址</label><input id="source" placeholder="https://example.com/readme.md 或 ./foods.md" autocomplete="off"><button type="submit">载入</button><a href="README.md" id="help">阅读规范 ↗</a></form>
      <input type="file" id="file" accept=".md,.markdown,text/markdown,text/plain" hidden>
    </header>
    <main class="layout">
      <section class="panel editor-panel" aria-label="Markdown 原文编辑器">
        <div class="panel-bar">
          <label for="editor">Markdown 原文</label>
          <span class="panel-tools"><span id="charCount">0 字</span><button id="copySource" type="button">复制原文</button></span>
        </div>
        <div class="editor-stack">
          <pre id="editorHighlight" aria-hidden="true"><code></code></pre>
          <textarea id="editor" spellcheck="false" aria-describedby="editorHint" placeholder="在左侧粘贴或输入 Markdown…"></textarea>
        </div>
        <div class="editor-hint" id="editorHint">语法高亮 · 实时预览 · 支持 $…$ 与 $$…$$ 公式 · 可拖入 .md 文件</div>
      </section>
      <aside class="preview-column">
        <section class="panel document-panel" aria-label="文档预览">
          <div class="panel-bar"><span>实时预览</span><span id="documentName">未命名.md</span></div>
          <div id="preview" class="preview"><article class="markdown" id="document"></article></div>
          <nav class="pager" aria-label="预览分页" id="pager"></nav>
        </section>
        <section class="panel outline-panel"><div class="panel-bar"><span>目录</span><span id="headingCount">0 节</span></div><nav id="outline" aria-label="文档目录"></nav></section>
      </aside>
    </main>
    <footer><span id="status" role="status">就绪</span><span>文字在这里，安静成页。</span></footer>
    <div class="view-controls" aria-label="查看模式工具">
      <details class="view-outline" id="viewOutlinePanel">
        <summary>目录 <span id="viewHeadingCount">0 节</span></summary>
        <nav id="viewOutline" aria-label="文档目录"></nav>
      </details>
      <details class="view-more" id="viewMore">
        <summary aria-label="打开更多操作" title="更多操作">•••</summary>
        <div class="view-more-menu"><button id="returnToEdit" type="button">进入编辑模式</button><button id="viewThemeToggle" type="button" aria-pressed="false">切换深色模式</button></div>
      </details>
    </div>
  </div>
  <main id="readerRoot" class="reader-root" hidden><article class="markdown" id="readerDocument"></article></main>
  <noscript>请启用 JavaScript 以显示 Markdown 文档。</noscript>
</body>
</html>
