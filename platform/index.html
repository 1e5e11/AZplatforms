<html>

<head>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="shortcut icon" href="https://ssssssss.eu.org/az-128.ico" type="image/x-icon" />
    <meta charset="utf-8">
    <title>AZ Platforms</title>
    <style type="text/css">
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            transition: 0.2s;
        }

        html,
        body {
            width: 100%;
            min-height: 100%;
        }

        body {
            font-family: 'Times New Roman', 宋体, serif, 'Liberation Mono';
            cursor: default;
            user-select: none;
            color: var(--wzys);
        }

        .vfr {
            position: absolute;
        }

        .az {
            color: var(--bjsdfz);
        }

        .red-kuang {
            transform: translateZ(0);
            position: absolute;
            border: 0;
            border-radius: .15em;
            background-color: var(--hanbj);
            box-shadow: 0 1px 9px var(--bjsdfz-a);
            overflow: auto;
        }

        .red-kuang::before {
            content: "";
            background: inherit;
            background-size: cover;
            filter: blur(8px);
            backdrop-filter: url(#glass) blur(1px);
            z-index: -1;
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }

        .bj {
            position: fixed;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: var(--ymbj);
            overflow: hidden;
        }

        .title-bar {
            position: fixed;
            left: 0;
            top: 0;
            width: 100%;
            height: 90px;
            z-index: 5;
            background-color: var(--hanbj);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            box-shadow: 0 1px 9px var(--bjsdfz-a);
            border-radius: 0;
            border-bottom: 1px solid var(--bjsdfz-a);
            transition: 0.2s, backdrop-filter 0s, -webkit-backdrop-filter 0s;
        }

        .title-bar .title-txt {
            position: absolute;
            left: 0;
            right: 0;
            top: 0;
            height: 90px;
            line-height: 90px;
            text-align: center;
            font-size: 28px;
            font-weight: normal;
            color: var(--bjsdfz);
            letter-spacing: 2px;
            text-shadow: 0 0 12px var(--bjsdfz-a);
        }

        .sort-control {
            position: absolute;
            right: 20px;
            top: 24px;
            width: 238px;
            height: 40px;
            line-height: 40px;
            font-size: 14px;
            color: var(--wzys);
        }

        .sort-control select {
            position: absolute;
            top: 2px;
            right: 0;
            width: 190px;
            height: 36px;
            border: 0;
            border-bottom: 2px solid transparent;
            border-radius: .15em;
            background-color: var(--hanbj);
            color: var(--wzys);
            box-shadow: 0 1px 5px var(--bjsdfz-a);
            backdrop-filter: blur(15px);
            font-family: inherit;
            font-size: 14px;
            font-style: italic;
            cursor: default;
            text-indent: 3px;
        }

        .sort-control select:hover {
            box-shadow: 0 0 10px var(--bjsdfz-a);
        }

        .sort-control select:focus {
            border-bottom-color: var(--bjsdfz-a);
        }

        .sort-control option {
            color: var(--bjsdfz);
        }

        .sort-control select:focus-visible,
        .card .btn:focus-visible {
            outline: 2px solid var(--bjsdfz);
            outline-offset: 2px;
        }

        .cardarea {
            position: fixed;
            left: 0;
            right: 0;
            top: 90px;
            bottom: 0;
            z-index: 4;
            overflow-y: auto;
            overflow-x: hidden;
        }

        .card-canvas {
            position: relative;
            width: 100%;
        }

        .cardarea .card {
            transform: translateZ(0);
            position: absolute;
            height: 260px;
            border-radius: .15em;
            border: 1px solid var(--bjsdfz-a);
            background-color: var(--hanbj);
            box-shadow: 0 1px 9px var(--bjsdfz-a);
            backdrop-filter: blur(15px);
        }

        .cardarea .card::before {
            content: "";
            position: absolute;
            inset: 0;
            background: inherit;
            background-size: cover;
            filter: blur(8px);
            backdrop-filter: url(#glass) blur(1px);
            z-index: -1;
        }

        .cardarea .card:hover {
            box-shadow: 0 2px 14px var(--bjsdfz-a);
        }

        .card-header {
            position: static;
        }

        .card-bg-icon {
            position: absolute;
            z-index: 0;
            top: 4px;
            right: 4px;
            width: 148px;
            height: 148px;
            object-fit: contain;
            border-radius: .15em;
            opacity: .16;
            mix-blend-mode: multiply;
            -webkit-mask-image: radial-gradient(ellipse at center, var(--icon-mask) 20%, transparent 76%);
            mask-image: radial-gradient(ellipse at center, var(--icon-mask) 20%, transparent 76%);
        }

        .card-heading {
            position: static;
        }

        .card .t {
            position: absolute;
            top: 20px;
            z-index: 1;
            left: 18px;
            right: 18px;
            max-height: 64px;
            font-size: 22px;
            line-height: 30px;
            font-weight: normal;
            color: var(--wzys);
            overflow-wrap: anywhere;
        }

        .card-description {
            position: static;
            color: var(--wzys-a);
            font-size: 16px;
            line-height: 1.5;
            overflow-wrap: anywhere;
        }

        .card-description .s {
            position: absolute;
            z-index: 1;
            top: 82px;
            left: 18px;
            right: 18px;
        }

        .card-description .d {
            position: absolute;
            z-index: 1;
            top: 122px;
            left: 18px;
            right: 18px;
            color: var(--wzys);
        }

        .card-footer {
            position: static;
        }

        .card-actions {
            position: absolute;
            z-index: 1;
            left: 18px;
            bottom: 16px;
            width: 166px;
            height: 36px;
        }

        .card .btn {
            position: absolute;
            top: 0;
            width: 78px;
            height: 36px;
            border-radius: .15em;
            border: 2px solid var(--bjsdfz);
            background: transparent;
            text-align: center;
            line-height: 32px;
            color: var(--bjsdfz);
            cursor: default;
            font-size: 16px;
            font-family: inherit;
            font-style: normal;
            text-indent: 0;
        }

        .card .btn:hover {
            background: var(--bjsdfz);
            color: var(--ymbj);
            box-shadow: 0 1px 5px var(--bjsdfz);
            transition: .3s;
        }

        .card .btn:active {
            transform: scale(.92);
            transition: .1s;
        }

        .card .btn.o {
            left: 0;
        }

        .card .btn.g {
            left: 88px;
        }

        .card .ai {
            position: absolute;
            z-index: 1;
            right: 18px;
            top: 157px;
            font-size: 12px;
            color: var(--bjsdfz);
            border: 1px solid var(--bjsdfz-a);
            border-radius: .15em;
            padding: 2px 7px;
        }

        .card .time {
            position: absolute;
            z-index: 1;
            left: 18px;
            top: 158px;
            width: 228px;
            font-size: 13px;
            line-height: 20px;
            color: var(--wzys-a);
        }

        .card .time span {
            display: block;
        }

        @media (max-width: 760px) {
            .title-bar {
                height: 104px;
            }
            .title-bar .title-txt {
                height: 48px;
                line-height: 48px;
                font-size: 23px;
            }
            .sort-control {
                top: 56px;
                right: 0;
                left: 0;
                margin: auto;
            }
            .cardarea {
                top: 104px;
            }
        }

        @media (max-width: 375px) {
            .card .t {
                font-size: 20px;
                line-height: 28px;
            }
            .card-description .s {
                top: 84px;
            }
        }

        *::-webkit-scrollbar {
            width: 14px;
            height: 14px;
            border-radius: .15em;
        }

        *::-webkit-scrollbar-track {
            transition: cubic-bezier(0.5, 0, 0.5, 1) .25s;
            background-color: transparent;
            border-radius: 5px;
        }

        *::-webkit-scrollbar-thumb {
            transition: cubic-bezier(0.5, 0, 0.5, 1) .25s;
            display: block;
            background-clip: padding-box;
            border: 5px solid transparent;
            border-radius: .15em;
            background-color: var(--bjsdfz-a);
        }

        *::-webkit-scrollbar-thumb:hover {
            transition: cubic-bezier(0.5, 0, 0.5, 1) .25s;
            display: block;
            border: 4px solid transparent;
            background-color: var(--bjsdfz-a);
        }

        *::-webkit-scrollbar-button {
            display: none;
        }

        *::-webkit-scrollbar-corner {
            background-color: transparent;
        }
    </style>
    <style id="szys">
        :root {
            --bjsdfz: #7c0a21;
            --bjsdfz-a: #7c0a2164;
            --wzys: black;
            --wzys-a: #555;
            --hanbj: rgba(255, 255, 255, .6);
            --ymbj: #ffffff;
            --icon-mask: black;
        }
    </style>
    <script type="text/javascript" src="app.js"></script>
</head>

<body onselectstart="return false" onbeforecopy="return false">
    <div class="bj">
    </div>

    <div class="title-bar">
        <div class="title-txt">AZ Platforms</div>
        <label class="sort-control" for="sort-order">
            <span>排序</span>
            <select id="sort-order">
                <option value="default">默认</option>
                <option value="latest">最新（最新开发）</option>
                <option value="earliest">最早（首次开发）</option>
            </select>
        </label>
    </div>
    <div class="cardarea" id="cardarea"></div>

    <svg style="display:none">
        <defs>
            <filter id="glass" x="0%" y="0%" width="100%" height="100%">
                <feTurbulence type="fractalNoise" baseFrequency="0.008 0.008" numOctaves="2" seed="114514" result="noise" />
                <feGaussianBlur in="noise" stdDeviation="2" result="blurred" />
                <feDisplacementMap in="SourceGraphic" in2="blurred" scale="20" xChannelSelector="R" yChannelSelector="G" />
            </filter>
        </defs>
    </svg>

</body>

</html>
