<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AZ presented — 管理</title>
<meta name="description" content="AZ presented admin console.">
<meta name="robots" content="noindex, nofollow">
<meta id="theme-color" name="theme-color" content="#ffffff">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='3' fill='%23fff'/%3E%3Cpath d='M14 46 L32 16 L50 46 Z' fill='none' stroke='%237c0a21' stroke-width='3'/%3E%3Ccircle cx='32' cy='38' r='4' fill='%237c0a21'/%3E%3C/svg%3E">
<script>
(function () {
  var theme;
  try { theme = localStorage.getItem('abyss_theme'); } catch (e) { theme = ''; }
  if (theme !== 'dark' && theme !== 'light') {
    theme = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
  }
  document.documentElement.setAttribute('data-theme', theme);
  var meta = document.getElementById('theme-color');
  if (meta) meta.setAttribute('content', theme === 'dark' ? '#171315' : '#ffffff');
})();
</script>
<link rel="preconnect" href="https://ssssssss.eu.org" crossorigin>
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body class="az-ui" data-page="admin">
<svg style="display:none" aria-hidden="true">
  <defs>
    <filter id="az-glass" x="0%" y="0%" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.008 0.008" numOctaves="2" seed="114514" result="noise" />
      <feGaussianBlur in="noise" stdDeviation="2" result="blurred" />
      <feDisplacementMap in="SourceGraphic" in2="blurred" scale="20" xChannelSelector="R" yChannelSelector="G" />
    </filter>
  </defs>
</svg>

<div class="app">
  <header class="topbar">
    <a class="brand" href="index.html" aria-label="返回博客">
      <span class="brand-cn">AZ presented</span>
      <span class="brand-en">管理台</span>
    </a>
    <div class="top-tools">
      <button id="theme-toggle" class="az-button btn" type="button" aria-label="切换到深色模式">深色</button>
      <button id="lang-toggle" class="az-button btn" type="button" aria-label="切换语言">EN</button>
      <a id="nav-admin" class="az-button btn" href="index.html">博客</a>
    </div>
  </header>

  <div id="view" class="view" aria-live="polite"></div>

  <footer id="statusbar" class="statusbar"></footer>
</div>

<script src="config.js"></script>
<script src="assets/js/app.js"></script>
</body>
</html>
